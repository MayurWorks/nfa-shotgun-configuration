# Top-level project-root node for the "Artists" tree.
#
# This folder is a SIBLING of core/schema/project (the tank_name-rooted
# tree), not a child of it. Toolkit's static folder engine requires every
# top-level folder directly under a schema/ directory to declare
# type: "project" with a root_name (see tk-core's
# folder/configuration.py::_load_schema, which processes every
# subdirectory of core/schema/ independently and requires each one to be
# its own "project" node) -- there is no requirement that a studio have
# only one such node, or that "Artists"/"Projects" live inside the
# tank_name folder. This is what lets "Artists" resolve directly under
# the storage root (/jobs/SlateX/Artists/...) with NO {tank_name} segment
# in front of it, while the pre-existing "project" node (tank_name -
# e.g. "str") is kept only for 00_pipeline/ and Publish/ (see
# core/schema/project.yml, project/00_pipeline, project/Publish).
#
# The project-code folder that used to be provided "for free" by
# tank_name sitting above Artists/ is now provided explicitly as a
# {sg_projectcode}-driven folder immediately inside this node -- see
# sg_projectcode.yml alongside this comment's sibling files. That is the
# folder that gives /jobs/SlateX/Artists/{sg_projectcode}/... (e.g.
# .../Artists/str/EP_2/STRM_E2_0010/...), matching the studio's required
# Artists/<project_code>/... structure. See templates.yml's shot_root
# for the corresponding template definition.

type: "project"

# name of project root as defined in roots.yml / Local Storage "primary"
root_name: "primary"
