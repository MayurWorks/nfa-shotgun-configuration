# the type of dynamic content
type: "shotgun_entity"

# the shotgun field to use for the folder name
name: "code"

# the shotgun entity type to connect to
entity_type: "Sequence"

# shotgun filters to apply when getting the list of items -- uses
# $Artists, NOT $project. tk-core's FilterExpressionToken resolution
# (folder/folder_types/expression_tokens.py::_resolve_ref_r) matches a
# $token against an ANCESTOR FOLDER'S LITERAL NAME, walking up the
# schema tree - not by entity type. This file's ancestors are
# core/schema/Artists/sg_projectcode/ and core/schema/Artists/ (see
# ../sg_projectcode.yml) - there is no folder literally named "project"
# anywhere above this file (that name only exists in the separate,
# unrelated tank_name-rooted core/schema/project/ tree, a sibling, not
# an ancestor). $Artists is what ../sg_projectcode.yml itself is named
# via its parent Artists.yml, so it's the token this file's own $token
# walk-up can actually find. A $project token here produces the exact
# TankError seen in production: "$project could not be found in ... or
# in any of its parents" -- this was fixed on ../sg_projectcode.yml
# itself in a prior commit but missed here, one level deeper, causing
# the same class of failure to resurface at this file instead.
filters: [ { "path": "project", "relation": "is", "values": [ "$Artists" ] } ]
