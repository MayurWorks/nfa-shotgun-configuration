#
# The keys section contains the definitions for all the different keys that are being
# used by Sgtk. A key is a magic token that is replaced by a value at runtime, for example
# {Shot}. The section below tells Sgtk which data types and formats to expect for each key.
#
keys:
  Sequence:
    type: str
  Shot:
    type: str
  Step:
    type: str
  sg_asset_type:
    type: str
  Asset:
    type: str
  Projectcode:
    type: str
    shotgun_entity_type: Project
    shotgun_field_name: sg_projectcode
  name:
    type: str
    filter_by: alphanumeric
  publish_extension:
    type: str
  publish_name:
    type: str
    filter_by: alphanumeric
  publish_type:
    type: str
  iteration:
    type: int
  version:
    type: int
    format_spec: "03"
  version_four:
    type: int
    format_spec: "04"
    alias: version
  timestamp:
    type: str
  width:
    type: int
  height:
    type: int
  colorspace:
    type: int
  SEQ:
    type: sequence
    format_spec: "04"

  # Represents the optional output name for frames written by the ShotGrid Write Node
  write.output:
    alias: output
    type: str
    filter_by: alphanumeric

#
# The paths section contains all the the key locations where files are to be stored
# by Sgtk Apps. Each path is made up of several keys (like {version} or {shot}) and
# these are defined in the keys section above.
#
# Apps use these paths as part of their configuration to define where on disk
# different files should go.
#

paths:
  # Common  path definitions to use as shorthand in order to avoid repetitive and verbose
  # templates. This also makes it easy to change any of the common root paths and have the
  # changes apply to all templates that use them.
  #
  # These don't require the standard formatting (with definition and root_name) because they
  # will be set within each template that uses the alias.
  #
  # NOTE: these match the studio's Artists/Projects convention (see
  # core/templates/tk-nuke.yml), NOT NFA's original 03_workfiles/04_publish/
  # 05_renders tree -- that tree and its schema folders were removed. Every
  # other DCC template file (tk-3dsmax, tk-aftereffects, tk-houdini, tk-maya,
  # tk-motionbuilder, tk-photoshopcc, tk-substancepainter, tk-unreal) resolves
  # @shot_root/@asset_root from here, so these must stay in sync with
  # tk-nuke.yml's shot_root/asset_root/shot_publish_root/asset_publish_root
  # definitions -- do not let tk-nuke.yml redefine these keys locally again.
  # NOTE: no {Projectcode} folder segment here. The schema's project-root
  # folder (core/schema/project.yml, type: "project") is ALREADY named from
  # the ShotGrid Project's tank_name field (set to the project code, e.g.
  # "STRM", by the project-creator tool) -- tank_name is a hard Toolkit
  # requirement, not something this config can remove or relocate (tk-core
  # raises TankMissingTankNameError if it's unset, and the project-level
  # folder in every schema always represents the project this way). Putting
  # {Projectcode} inside Artists/Publish as well was pure duplication that
  # didn't match what the schema tree actually builds on disk, and caused
  # sgtk.from_path to resolve to the wrong location. {Projectcode} still
  # appears in FILENAMES elsewhere in this file (batch names, mov/usd/obj
  # names) -- that's an intentional disambiguator, not a folder path, and
  # is unaffected by this note.
  asset_root: Artists/Assets/{sg_asset_type}/{Asset}/{Step}
  shot_root: Artists/{Sequence}/{Shot}/{Step}

  sequence_root: Artists/{Sequence}

  asset_publish: Publish/Assets/{sg_asset_type}/{Asset}/{Step}
  shot_publish: Publish/{Sequence}/{Shot}/{Step}

  # No separate top-level 05_renders tree -- renders live under a renders/
  # subfolder of the publish root instead (matches tk-nuke.yml's own
  # @shot_publish_root/{Step}/renders/... pattern). Must resolve to a path
  # DISTINCT from @shot_publish/@asset_publish themselves -- Toolkit rejects
  # two template names that resolve to the identical (root, path), even when
  # one is only reached through another alias.
  asset_render_publish: "@asset_publish/renders"
  shot_render_publish: "@shot_publish/renders"


  ##########################################################################################
  # Project level paths
  #

  # OCIO config path
  ocio_config:
    definition: "00_pipeline/ocio/config.ocio"

  # USD paths
  usd_asset_publish:
    definition: "@asset_publish/usd/{name}/v{version}/{Projectcode}_{Asset}_{Step}_{name}_v{version}.usd"
  usd_shot_publish:
    definition: "@shot_publish/usd/{name}/v{version}/{Projectcode}_{Shot}_{Step}_{name}_v{version}.usd"

  # OBJ Sculpts Standalone Publish Template
  obj_asset_publish:
    definition: "@asset_publish/obj/{Projectcode}_{Asset}_{Step}_pub_v{version}.obj"

  ##########################################################################################
  # Sequence level paths
  #

  ##########################################################################################
  # Shot level paths
  #

  # Review files
  shot_review_maya:
    definition: "@shot_root/maya/previews/{name}/{Projectcode}_{Sequence}_{Shot}_{name}_sRGB_v{version}.mov"
  shot_review_houdini:
    definition: "@shot_root/houdini/previews/{name}/{Projectcode}_{Sequence}_{Shot}_{name}_sRGB_v{version}.mov"

  ##########################################################################################
  # Asset pipeline

  # Review files
  asset_review_maya:
    definition: "@asset_root/maya/previews/{name}/{Projectcode}_{Asset}_{Step}_{name}_sRGB_v{version}.mov"
  asset_review_houdini:
    definition: "@asset_root/houdini/previews/{name}/{Projectcode}_{Asset}_{Step}_{name}_sRGB_v{version}.mov"



#
# The strings section is similar to the paths section - but rather than defining paths
# on disk, it contains a list of strings. Strings are typically used when you want to be
# able to configure the way data is written to shotgun - it may be the name field for a
# review version or the formatting of a publish.
#

strings:
  deadline_asset_batch_name: "{Projectcode} {Asset}"
  deadline_shot_batch_name: "{Projectcode} {Sequence} {Shot}"
