# Studio ShotGrid Toolkit templates.yml
# Custom convention (not NFA's) — see conversation for design decisions.
#
# SINGLE STORAGE ROOT ("primary"), pointing at /jobs/<ProjectName>
# (configured as a Local Storage entity in ShotGrid Site Preferences).
#
# "Artists" and "Projects" are their OWN top-level schema "project" nodes
# (core/schema/Artists.yml, core/schema/Projects.yml) — siblings of the
# tank_name-rooted core/schema/project.yml tree, not children of it. Each
# resolves directly under "primary" with no tank_name segment in front of
# it, and the project's short code (sg_projectcode, e.g. "str") appears as
# a folder immediately INSIDE Artists/Projects instead (see
# core/schema/Artists/sg_projectcode.yml, core/schema/Projects/
# sg_projectcode.yml). tank_name (still a hard Toolkit requirement for the
# separate core/schema/project.yml node) is only used today for 00_pipeline/
# and Publish/ — see core/schema/project/.
#
# Work folder structure:
#   Artists/<Projectcode>/<Sequence>/<Shot>/<Step>/Nuke/<Step>/
#   e.g. Artists/str/EP_2/STRM_E2_0010/RTO/Nuke/RTO/
#
# Publish folder structure (still resolves under the tank_name project
# root, unaffected by this convention — see core/schema/project/Publish):
#   <tank_name>/Publish/<Sequence>/<Shot>/<Step>/Nuke/<Step>/
#   e.g. str/Publish/EP_2/STRM_E2_0010/RTO/Nuke/RTO/
#
# Plates:
#   Projects/<Projectcode>/Plates/<Sequence>/<Shot>/
#   e.g. Projects/str/Plates/EP_2/STRM_E2_0010/STRM_E2_0010.1001.exr
#
# Notes:
# - {Shot} is the FULL composite shot code as stored in ShotGrid (e.g. STRM_E2_0010),
#   already encoding project code + sequence + shot number. It is NOT decomposed.
# - {Sequence} is the episode/sequence folder (e.g. EP_2), kept separate from {Shot}.
# - {Projectcode} (the sg_projectcode key, defined in common.yml) DOES now appear
#   as a folder-path segment under Artists/ and Projects/ (see common.yml's
#   asset_root/shot_root/sequence_root) — this is a deliberate change from an
#   earlier revision of this file, which removed {Projectcode} from folder paths
#   entirely because it duplicated tank_name at the project root. That removal
#   is why the pipeline was, until this fix, resolving to
#   /jobs/SlateX/<tank_name>/Artists/... instead of the required
#   /jobs/SlateX/Artists/<Projectcode>/.... Now that Artists/Projects are their
#   own schema roots (not children of the tank_name node), {Projectcode} is the
#   only thing that identifies which project's folder this is, so it is
#   required here — this is not the same duplication that was removed before.
#   {Projectcode} is still additionally used in some FILENAMES as a
#   disambiguator (e.g. Deadline batch names, some DCC preview filenames) —
#   that usage is separate and unaffected.
# - Work and Publish ARE separated as two top-level trees. Toolkit requires every
#   template's resolved path to be unique (root_name, definition) — aliasing a
#   publish template to the exact same path as its work template is rejected at
#   load time with "duplicate entries in your templates.yml file". A real,
#   distinct Publish/ tree is the standard, supported pattern (matches Shotgun's
#   own tk-config-default2), so we use that instead of NFA's numbered folders.
# - Version padding: 3 digits (v001, v002, ...).

keys:
  Sequence:
    type: str
  Shot:
    type: str
  Step:
    type: str
  Asset:
    type: str
  sg_asset_type:
    type: str
    alias: AssetType
  ProjectName:
    type: str
    shotgun_entity_type: Project
    shotgun_field_name: name
  name:
    type: str
    filter_by: alphanumeric
  version:
    type: int
    format_spec: "03"
  SEQ:
    type: sequence
    format_spec: "04"
  timestamp:
    type: str
  write.output:
    alias: output
    type: str
    filter_by: alphanumeric

paths:
  # Studio-wide Nuke starter template script (used by tk-nuke-template app
  # when opening a new work file for a task). One shared file for now —
  # add per-department variants later if needed (e.g. separate Roto/Paint).
  nuke_template_file:
    definition: "00_pipeline/nuke/template/StudioTemplate.nk"

  # shot_root / asset_root / shot_publish / asset_publish are defined ONCE,
  # in core/templates/common.yml, and referenced directly here (@shot_root,
  # @asset_root, @shot_publish, @asset_publish below) rather than aliased
  # again under a second name -- common.yml is shared by every DCC template
  # file (tk-3dsmax, tk-aftereffects, tk-houdini, tk-maya, tk-motionbuilder,
  # tk-photoshopcc, tk-substancepainter, tk-unreal all reference these too),
  # so a local redefinition or a same-path second alias here would either
  # silently diverge from what those other DCCs resolve to, or fail config
  # load outright as a duplicate template ("shot_publish_root" and
  # "shot_publish" resolving to the identical Publish/... path was tried
  # and rejected by Toolkit -- see git history). See common.yml's comment
  # above asset_root/shot_root for the actual path definitions.

  ##########################################################################################
  # Nuke — shot level
  #

  shot_work_area_nuke:
    definition: "@shot_root/Nuke/{Step}"

  # Working Nuke script.
  # e.g. STRM_E2_0010_comp_v001.nk
  nuke_shot_work:
    definition: "@shot_root/Nuke/{Step}/{Shot}_{Step}_v{version}.nk"

  # Snapshots/autosave backups of the working script.
  nuke_shot_snapshot:
    definition: "@shot_root/Nuke/{Step}/snapshots/{Shot}_{Step}_v{version}_{timestamp}.nk"

  # Publish area/file — real, distinct location under Publish/, not an
  # alias of the work template.
  shot_publish_area_nuke:
    definition: "@shot_publish/Nuke/{Step}"

  nuke_shot_publish:
    definition: "@shot_publish/Nuke/{Step}/{Shot}_{Step}_v{version}.nk"

  # Plate location — under Projects/ (client-delivered source material),
  # its own top-level schema root (core/schema/Projects.yml), just a
  # different physical root than Artists/. {Projectcode} is required here
  # (see comment near the top of this file) since Projects/ no longer sits
  # under the tank_name-named project folder that used to disambiguate it.
  # 4-digit frame padding, .exr.
  # e.g. Projects/str/Plates/EP_2/STRM_E2_0010/STRM_E2_0010.1001.exr
  shot_plate:
    definition: "Projects/{Projectcode}/Plates/{Sequence}/{Shot}/{Shot}.{SEQ}.exr"

  # Write node EXR output — WIP renders stay under Artists/ alongside work files.
  nuke_shot_render:
    definition: "@shot_root/Nuke/{Step}/renders/{name}/{write.output}/v{version}/{Shot}_{Step}_{name}_{write.output}_v{version}.{SEQ}.exr"

  # Published EXR output — real, distinct location under Publish/.
  nuke_shot_render_pub:
    definition: "@shot_publish/Nuke/{Step}/renders/{name}/{write.output}/v{version}/{Shot}_{Step}_{name}_{write.output}_v{version}.{SEQ}.exr"

  # Review MOV output.
  nuke_shot_render_movie:
    definition: "@shot_root/Nuke/{Step}/previews/{Shot}_{Step}_{name}_v{version}.mov"

  ##########################################################################################
  # Nuke — asset level (minimal, added to satisfy NFA's asset_step environment
  # references; not yet a fully designed asset pipeline)
  #

  asset_work_area_nuke:
    definition: "@asset_root/Nuke/{Step}"

  nuke_asset_work:
    definition: "@asset_root/Nuke/{Step}/{Asset}_{Step}_v{version}.nk"

  nuke_asset_snapshot:
    definition: "@asset_root/Nuke/{Step}/snapshots/{Asset}_{Step}_v{version}_{timestamp}.nk"

  asset_publish_area_nuke:
    definition: "@asset_publish/Nuke/{Step}"

  nuke_asset_publish:
    definition: "@asset_publish/Nuke/{Step}/{Asset}_{Step}_v{version}.nk"

  nuke_asset_render:
    definition: "@asset_root/Nuke/{Step}/renders/{name}/{write.output}/v{version}/{Asset}_{Step}_{name}_{write.output}_v{version}.{SEQ}.exr"

  nuke_asset_render_pub:
    definition: "@asset_publish/Nuke/{Step}/renders/{name}/{write.output}/v{version}/{Asset}_{Step}_{name}_{write.output}_v{version}.{SEQ}.exr"

  nuke_asset_render_movie:
    definition: "@asset_root/Nuke/{Step}/previews/{Asset}_{Step}_{name}_v{version}.mov"

strings:
  # Version entity name shown in ShotGrid when Publish2 creates a review Version.
  nuke_shot_version_name: "{Shot}_{Step}_{name}_v{version}"