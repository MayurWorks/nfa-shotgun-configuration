# Studio ShotGrid Toolkit templates.yml
# Custom convention (not NFA's) — see conversation for design decisions.
#
# SINGLE STORAGE ROOT ("primary"), pointing at /jobs/<ProjectName>
# (configured as a Local Storage entity in ShotGrid Site Preferences).
# Artists/ and Projects/ are both subfolders under this one root.
#
# Folder structure:
#   Artists/<ProjectCode>/<Sequence>/<Shot>/<Step>/Nuke/<Step>/
#   e.g. Artists/STRM/EP_2/STRM_E2_0010/Comp/Nuke/Comp/
#
# Plates:
#   Projects/<ProjectCode>/Plates/<Sequence>/<Shot>/
#   e.g. Projects/STRM/Plates/EP_2/STRM_E2_0010/STRM_E2_0010.1001.exr
#
# Notes:
# - {Shot} is the FULL composite shot code as stored in ShotGrid (e.g. STRM_E2_0010),
#   already encoding project code + sequence + shot number. It is NOT decomposed.
# - {Sequence} is the episode/sequence folder (e.g. EP_2), kept separate from {Shot}.
# - {ProjectCode} is the short project code folder directly under Artists/ (e.g. STRM).
# - No separate work/publish/render split within Artists/ — single unified area
#   per shot/step (unlike NFA's 03_workfiles/04_publish/05_renders).
# - Version padding: 3 digits (v001, v002, ...).

keys:
  Sequence:
    type: str
  Shot:
    type: str
  Step:
    type: str
  ProjectCode:
    type: str
    shotgun_entity_type: Project
    shotgun_field_name: sg_projectcode
  ProjectName:
    type: str
    shotgun_entity_type: Project
    shotgun_field_name: name
  name:
    type: str
    filter_by: alphanumeric
  version:
    type: int
    format_spec: "03"
  SEQ:
    type: sequence
    format_spec: "04"
  timestamp:
    type: str
  write.output:
    alias: output
    type: str
    filter_by: alphanumeric

paths:
  # Studio-wide Nuke starter template script (used by tk-nuke-template app
  # when opening a new work file for a task). One shared file for now —
  # add per-department variants later if needed (e.g. separate Roto/Paint).
  nuke_template_file:
    definition: "00_pipeline/nuke/template/StudioTemplate.nk"

  # Root of a shot's working area. No explicit root_name -> uses the
  # default "primary" storage root.
  shot_root: Artists/{ProjectCode}/{Sequence}/{Shot}/{Step}

  ##########################################################################################
  # Nuke — shot level
  #

  shot_work_area_nuke:
    definition: "@shot_root/Nuke/{Step}"

  # Working Nuke script.
  # e.g. STRM_E2_0010_comp_v001.nk
  nuke_shot_work:
    definition: "@shot_root/Nuke/{Step}/{Shot}_{Step}_v{version}.nk"

  # Snapshots/autosave backups of the working script.
  nuke_shot_snapshot:
    definition: "@shot_root/Nuke/{Step}/snapshots/{Shot}_{Step}_v{version}_{timestamp}.nk"

  # "Publish" template/area — same location as work, since this studio has
  # no separate work/publish split (unlike NFA's 03_workfiles/04_publish).
  # Workfiles2 and Publish2 both need a publish template even in a unified
  # layout, to track publish state in their UI.
  shot_publish_area_nuke:
    definition: "@shot_work_area_nuke"

  nuke_shot_publish:
    definition: "@nuke_shot_work"

  # Plate location — under Projects/ (client-delivered source material),
  # same "primary" root, just a different subfolder than Artists/.
  # 4-digit frame padding, .exr.
  # e.g. Projects/STRM/Plates/EP_2/STRM_E2_0010/STRM_E2_0010.1001.exr
  shot_plate:
    definition: "Projects/{ProjectCode}/Plates/{Sequence}/{Shot}/{Shot}.{SEQ}.exr"

  # Write node EXR output — stays under Artists/ alongside work files.
  nuke_shot_render:
    definition: "@shot_root/Nuke/{Step}/renders/{name}/{write.output}/v{version}/{Shot}_{Step}_{name}_{write.output}_v{version}.{SEQ}.exr"

  # "Publish" alias for the render template — same location, no split.
  nuke_shot_render_pub:
    definition: "@nuke_shot_render"

  # Review MOV output.
  nuke_shot_render_movie:
    definition: "@shot_root/Nuke/{Step}/previews/{Shot}_{Step}_{name}_v{version}.mov"

strings:
  # Version entity name shown in ShotGrid when Publish2 creates a review Version.
  nuke_shot_version_name: "{Shot}_{Step}_{name}_v{version}"


