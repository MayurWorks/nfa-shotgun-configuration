# Apps and Engines related to Asset based work (per-Step context).
#
# STUBBED OUT: this studio doesn't have an asset pipeline yet (shot-based
# only, see env/shot_step.yml for the real, working Nuke pipeline).
#
# NFA's original version of this file referenced templates and DCC configs
# (Alias, VRED, 3ds Max, Houdini, Maya, Photoshop, After Effects,
# MotionBuilder, SubstancePainter, Unreal) that either don't exist in this
# fork's core/templates/ or were already broken/missing in NFA's own
# upstream repo (e.g. tk-alias.yml and tk-vred.yml template files never
# existed there). Since Toolkit validates every env/*.yml file at
# bootstrap under CACHE_FULL (set by tk-desktop), leaving those broken
# references in place blocks Nuke from launching at all, even though this
# file is otherwise unused.
#
# When building out a real asset pipeline: design asset-level templates
# in core/templates/tk-nuke.yml (see asset_root / nuke_asset_work etc. for
# the pattern already started there), then re-add the DCCs you actually
# use here, one at a time, verifying each resolves before adding the next.

description: >
  Apps and Engines related to Asset based work. Currently stubbed out —
  this studio has no asset pipeline yet. See comment above.

includes:
- ./includes/frameworks.yml

################################################################################
# configuration for all engines to load in an asset step context
#
# Intentionally empty. Add engines here only once their corresponding
# templates and settings blocks are verified to resolve.

engines:

################################################################################
# reference all of the common frameworks

frameworks: "@frameworks"
