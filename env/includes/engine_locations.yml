# Nuke
# Forked from nfa-vfxim/tk-nuke (was pinned to github_release 0.14.6.1) to
# add automatic Task folder creation in pre_app_init() -- see commit
# "Ensure Task folders exist at earliest point of engine pre_app_init".
# tk-multi-launchapp's before_app_launch hook was confirmed via diagnostic
# logging to never fire for this site's Desktop launch path, so this
# engine-level fix is used instead. git_branch (not github_release) so
# pushes to main take effect without needing a new tagged release, matching
# nfa-shotgun-configuration / tk-nuke-projectsettings / tk-nuke-template.
engines.tk-nuke.location:
  type: path
  linux_path: /apps/shotgun/repos/NFA/tk-nuke
