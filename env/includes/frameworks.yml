################################################################################
# A single, top-level setting is defined: "@frameworks". This setting can
# be included and referenced wherever shared frameworks are required.

frameworks:
  # adobe - Common functionality for adobe products
  tk-framework-adobe_v1.x.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-adobe/v1.1.6
  # adminui - provides GUIs for administrative commands
  tk-framework-adminui_v0.x.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-adminui/v0.7.2
  # aliastranslations - provides Alias translation tools
  tk-framework-aliastranslations_v0.x.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-aliastranslations/v0.2.2
  # desktopserver - provides a server to run local commands.
  #
  # Bumped from v1.5.3 to v1.8.7 to fix:
  # "No module named 'tank_vendor.six.moves'" on Python 3.13 (same root
  # cause as the tk-core bump earlier in core/core_api.yml, but this is a
  # separate package with its own bundled tank_vendor.six usage).
  # v1.8.7 confirmed working: an earlier ShotGrid Desktop session in this
  # environment successfully loaded tk-framework-desktopserver v1.8.7
  # before this pin was set, with no import error.
  tk-framework-desktopserver_v1.x.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-desktopserver/v1.8.7
  # qtwidgets - collection of Toolkit related QT Widgets
  tk-framework-qtwidgets_v2.x.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-qtwidgets/v2.12.4
  # shotgunutils v4 - Shotgun Related Utilities
  tk-framework-shotgunutils_v4.x.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-shotgunutils/v4.4.15
  # shotgunutils v5 - Shotgun Related Utilities
  tk-framework-shotgunutils_v5.x.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-shotgunutils/v5.11.2
  # widget - QT Widget Framework for Tank Apps (qtwidgets fw predecessor)
  tk-framework-widget_v0.2.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-widget/v0.2.8
  tk-framework-widget_v1.x.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-widget/v1.2.1
  # desktopclient - A client for Shotgun Create
  tk-framework-desktopclient_v0.x.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-desktopclient/v0.3.2
  tk-framework-lmv_v0.x.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-lmv/v0.2.2
  # unrealqt - PySide build for Unreal (Windows-only)
  # Needed for unreal and substance painter
  tk-framework-unrealqt_v1.x.x:
    location:
      type: path
      linux_path: /apps/shotgun/repos/bundles/tk-framework-unrealqt/v1.2.3
