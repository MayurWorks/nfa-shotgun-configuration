# Studio tk-multi-loader2 settings.
# Copied from NFA's config unchanged — Loader2 browses PublishedFile
# entities via standard ShotGrid fields, no studio-specific template
# customization needed here.

includes:
    - ../app_locations.yml

################################################################################

settings.tk-multi-loader2.nuke:
  action_mappings:
    Alembic Cache: [geo_node]
    Image: [read_node]
    Movie: [read_node]
    Nuke Script: [script_import]
    Rendered Image: [read_node, deep_read_node]
    Texture: [read_node]
  entities:
    - caption: Shots
      entity_type: Shot
      filters:
        - [project, is, "{context.project}"]
      hierarchy: [sg_sequence, code]
    - caption: My Tasks
      entity_type: Task
      filters:
        - [task_assignees, is, "{context.user}"]
        - [project, is, "{context.project}"]
      hierarchy: [entity, content]
  publish_filters: [["sg_status_list", "is_not", null]]
  location: "@apps.tk-multi-loader2.location"
