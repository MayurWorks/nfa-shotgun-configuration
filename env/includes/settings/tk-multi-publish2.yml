# Studio tk-multi-publish2 settings.
# Adapted from NFA's config — removed the "Update Flame Clip" plugin since
# this studio doesn't use Flame. Everything else is the standard Toolkit
# "basic" Publish2 workflow, using our own template names.

includes:
    - ../app_locations.yml
    - ../engine_locations.yml

help_url: &help_url "https://help.autodesk.com/view/SGDEV/ENU/?guid=SG_Supervisor_Artist_sa_integrations_sa_integrations_user_guide_html#the-publisher"

################################################################################

settings.tk-multi-publish2.nuke.shot_step:
  collector: "{self}/collector.py:{engine}/tk-multi-publish2/basic/collector.py"
  collector_settings:
    Work Template: nuke_shot_work
  post_phase: "{self}/collector.py:{engine}/tk-multi-publish2/basic/post_phase.py"
  publish_plugins:
    - name: Publish to ShotGrid
      hook: "{self}/publish_file.py"
      settings: {}
    - name: Upload for review
      hook: "{self}/upload_version.py"
      settings: {}
    - name: Begin file versioning
      hook: "{engine}/tk-multi-publish2/basic/nuke_start_version_control.py"
      settings: {}
    - name: Publish to ShotGrid
      hook: "{self}/publish_file.py:{engine}/tk-multi-publish2/basic/nuke_publish_script.py"
      settings:
        Publish Template: nuke_shot_publish
    - name: Submit for Review
      hook: "{engine}/tk-multi-publish2/basic/submit_for_review.py"
      settings: {}
  help_url: *help_url
  location: "@apps.tk-multi-publish2.location"
