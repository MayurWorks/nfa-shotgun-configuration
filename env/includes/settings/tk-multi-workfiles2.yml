# Studio tk-multi-workfiles2 settings.
# Copied from NFA's config unchanged — Workfiles2 browses by standard
# ShotGrid Shot/Task hierarchy, using our own work/publish template names.

includes:
    - ../app_locations.yml

################################################################################

settings.tk-multi-workfiles2: &settings_tk-multi-workfiles2
  entities:
    - caption: Shots
      entity_type: Shot
      filters:
      hierarchy: [sg_sequence, code]
      sub_hierarchy:
        entity_type: Task
        filters:
        link_field: entity
        hierarchy: [step]
  location: "@apps.tk-multi-workfiles2.location"
  my_tasks_filters:
    - ["sg_status_list", "is_not", "wtg"]
    - ["sg_status_list", "is_not", "rdy"]
    - ["sg_status_list", "is_not", "hld"]
    - ["sg_status_list", "is_not", "omt"]
    - ["sg_status_list", "is_not", "apr"]
    - ['task_assignees', 'is', '{context.user}']

settings.tk-multi-workfiles2.nuke.shot_step:
  template_publish: nuke_shot_publish
  template_publish_area: shot_publish_area_nuke
  template_work: nuke_shot_work
  template_work_area: shot_work_area_nuke
  entities:
    - caption: Shots
      entity_type: Shot
      filters:
      hierarchy: [sg_sequence, code]
      sub_hierarchy:
        entity_type: Task
        filters:
        link_field: entity
        hierarchy: [step]
  location: "@apps.tk-multi-workfiles2.location"
