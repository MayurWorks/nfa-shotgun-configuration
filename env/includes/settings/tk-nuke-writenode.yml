################################################################################

includes:
- ../app_locations.yml

################################################################################

# asset
settings.tk-nuke-writenode.asset:
  template_script_work: nuke_asset_work
  categories:
    - category_name: main
      write_nodes:
          - name: exr (dwaa 16bit)
            file_type: exr
            render_template: nuke_asset_render
            publish_template: nuke_asset_render_pub
            tile_color: 4292673791
            settings:
              colorspace: ACES - ACES2065-1
              datatype: 16 bit half
              channels: rgb
              compression: DWAA

    - category_name: prerender
      default_category: True
      write_nodes:
        - name: exr (dwaa 16bit)
          file_type: exr
          render_template: nuke_asset_render
          publish_template: nuke_asset_render_pub
          tile_color: 2365546239
          settings:
            colorspace: scene_linear
            datatype: 16 bit half
            channels: rgba
            compression: DWAA
        - name: exr (zip 16bit)
          file_type: exr
          render_template: nuke_asset_render
          publish_template: nuke_asset_render_pub
          tile_color: 2365546239
          settings:
            colorspace: scene_linear
            datatype: 16 bit half
            channels: rgba
            compression: Zip (1 scanline)
        - name: exr (zip 32bit)
          file_type: exr
          render_template: nuke_asset_render
          publish_template: nuke_asset_render_pub
          tile_color: 2365546239
          settings:
            colorspace: scene_linear
            datatype: 32 bit float
            channels: rgba
            compression: Zip (1 scanline)

  location: "@apps.tk-nuke-writenode.location"

# shot
settings.tk-nuke-writenode.shot:
  template_script_work: nuke_shot_work
  categories:
    - category_name: main
      default_category: True
      write_nodes:
        - name: exr (dwaa 16bit)
          file_type: exr
          render_template: nuke_shot_render
          publish_template: nuke_shot_render_pub
          tile_color: 4292673791
          settings:
            colorspace: ACES - ACEScg
            datatype: 16 bit half
            # auto = rgba if what feeds the write has alpha, else rgb
            # (decided when the node is created; editable after)
            channels: auto
            compression: DWAA
          main_output: True

    # Intermediate renders: what pressing "w" gives after main.
    - category_name: prerender
      write_nodes:
        - name: exr (dwaa 16bit)
          file_type: exr
          render_template: nuke_shot_render
          publish_template: nuke_shot_render_pub
          tile_color: 2365546239
          settings:
            colorspace: ACES - ACEScg
            datatype: 16 bit half
            channels: rgba
            compression: DWAA
        - name: exr (zip 16bit)
          file_type: exr
          render_template: nuke_shot_render
          publish_template: nuke_shot_render_pub
          tile_color: 2365546239
          settings:
            colorspace: ACES - ACEScg
            datatype: 16 bit half
            channels: rgba
            compression: Zip (1 scanline)
        - name: exr (zip 32bit)
          file_type: exr
          render_template: nuke_shot_render
          publish_template: nuke_shot_render_pub
          tile_color: 2365546239
          settings:
            colorspace: ACES - ACEScg
            datatype: 32 bit float
            channels: rgba
            compression: Zip (1 scanline)

    # Quick review/dailies output — MOV instead of an EXR sequence.
    # Uses nuke_shot_write_movie, NOT nuke_shot_render_movie: this app
    # (tk-nuke-writenode) always injects a SEQ field when resolving a
    # render_template, so the template needs a {SEQ} token or this
    # app's config validation fails outright and it won't load at
    # all (see nuke_shot_write_movie's comment in
    # core/templates/tk-nuke.yml). nuke_shot_render_movie stays
    # {SEQ}-free for tk-multi-reviewsubmission /
    # tk-multi-deadlinereviewsubmission, which read an already-written
    # .mov and never supply SEQ.
    - category_name: review
      write_nodes:
        - name: mov (h264)
          file_type: mov
          render_template: nuke_shot_write_movie
          publish_template: nuke_shot_write_movie_pub
          tile_color: 2003395327
          settings:
            colorspace: Output - Rec.709
            mov64_codec: H.264
            mov64_quality_max: 3
            # mov64_fps is not set here: a review movie always gets the
            # script's fps (sg_fps via tk-nuke-projectsettings).

  # ---- On-demand write nodes -------------------------------------------
  # Nothing creates a write node by itself. Pressing "w" creates one - a
  # plain Write node with an "NFA ShotGrid" tab - already set up for this
  # shot and project: first w gives main, then prerender, prerender2, ...
  # (switch the category on the node for review). After that the node is
  # the artist's; the pipeline only keeps its render path on the current
  # script version, and only while the path is still the one it wrote.
  default_category: main
  follow_script_version: true
  # after a local render of an image sequence, leave a Read node named
  # render_<output> beside the write (refreshed on each render)
  auto_read_after_render: true

  location: "@apps.tk-nuke-writenode.location"
