# Studio tk-nuke-writenode settings.
# Adapted from NFA's config — trimmed to a single "main" EXR write node
# category per the studio's decision to skip prerender/mattepainting
# categories for now. Colorspace uses this studio's OCIO config (aces_1.2,
# working space ACEScg) instead of NFA's ACES2065-1.

includes:
    - ../app_locations.yml

################################################################################

settings.tk-nuke-writenode.shot:
  template_script_work: nuke_shot_work
  categories:
    - category_name: main
      default_category: True
      write_nodes:
        - name: exr (dwaa 16bit)
          file_type: exr
          render_template: nuke_shot_render
          publish_template: nuke_shot_render_pub
          tile_color: 4292673791
          settings:
            colorspace: ACES - ACEScg
            datatype: 16 bit half
            channels: rgb
            compression: DWAA
          main_output: True

  location: "@apps.tk-nuke-writenode.location"
