################################################################################

includes:
- ../app_locations.yml

################################################################################

# asset
settings.tk-nuke-writenode.asset:
  template_script_work: nuke_asset_work
  categories:
    - category_name: main
      write_nodes:
          - name: exr (dwaa 16bit)
            file_type: exr
            render_template: nuke_asset_render
            publish_template: nuke_asset_render_pub
            tile_color: 4292673791
            settings:
              colorspace: ACES - ACES2065-1
              datatype: 16 bit half
              channels: rgb
              compression: DWAA

    - category_name: prerender
      default_category: True
      write_nodes:
        - name: exr (dwaa 16bit)
          file_type: exr
          render_template: nuke_asset_render
          publish_template: nuke_asset_render_pub
          tile_color: 2365546239
          settings:
            colorspace: scene_linear
            datatype: 16 bit half
            channels: rgba
            compression: DWAA
        - name: exr (zip 16bit)
          file_type: exr
          render_template: nuke_asset_render
          publish_template: nuke_asset_render_pub
          tile_color: 2365546239
          settings:
            colorspace: scene_linear
            datatype: 16 bit half
            channels: rgba
            compression: Zip (1 scanline)
        - name: exr (zip 32bit)
          file_type: exr
          render_template: nuke_asset_render
          publish_template: nuke_asset_render_pub
          tile_color: 2365546239
          settings:
            colorspace: scene_linear
            datatype: 32 bit float
            channels: rgba
            compression: Zip (1 scanline)

  location: "@apps.tk-nuke-writenode.location"

# shot
settings.tk-nuke-writenode.shot:
  template_script_work: nuke_shot_work
  categories:
    - category_name: main
      default_category: True
      write_nodes:
        - name: exr (dwaa 16bit)
          file_type: exr
          render_template: nuke_shot_render
          publish_template: nuke_shot_render_pub
          tile_color: 4292673791
          settings:
            colorspace: ACES - ACEScg
            datatype: 16 bit half
            channels: rgb
            compression: DWAA
          main_output: True

    # Quick review/dailies output — MOV instead of an EXR sequence.
    # Reuses nuke_shot_render_movie, the same template
    # tk-multi-reviewsubmission / tk-multi-deadlinereviewsubmission
    # already write to, so a review write node and those tools land in
    # the same place.
    - category_name: review
      write_nodes:
        - name: mov (h264)
          file_type: mov
          render_template: nuke_shot_render_movie
          publish_template: nuke_shot_render_movie_pub
          tile_color: 2003395327
          settings:
            colorspace: Output - Rec.709
            mov64_codec: H.264
            mov64_quality_max: 3
            mov64_fps: 24

  location: "@apps.tk-nuke-writenode.location"
