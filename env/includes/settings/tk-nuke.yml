# Studio tk-nuke settings.
# Trimmed to only the shot_step context (the studio is shot-based, no
# asset/sequence/hiero-project contexts wired up yet — add those blocks
# here later if/when needed).

includes:
- ../app_locations.yml
- ../engine_locations.yml
- ./tk-multi-loader2.yml
- ./tk-multi-publish2.yml
- ./tk-multi-snapshot.yml
- ./tk-multi-workfiles2.yml
- ./tk-nuke-writenode.yml
- ./tk-nuke-template.yml

################################################################################
# Nuke

# project (minimal — used when launching Nuke from ShotGrid Desktop's
# project-level launcher, before a specific Shot/Task is picked. Once the
# artist opens a Shot/Task via File Open, Toolkit switches context into
# shot_step, which has the full app set: Publish2, Loader2, Writenode, etc.)
settings.tk-nuke.project:
  apps:
    tk-multi-about:
      location: "@apps.tk-multi-about.location"
    tk-multi-workfiles2: "@settings.tk-multi-workfiles2"
    tk-nuke-template: "@settings.tk-nuke-template.shot_step"
  menu_favourites:
  - {app_instance: tk-multi-workfiles2, name: File Open...}
  location: "@engines.tk-nuke.location"

# shot_step
settings.tk-nuke.shot_step:
  apps:
    tk-multi-about:
      location: "@apps.tk-multi-about.location"
    tk-multi-breakdown:
      location: "@apps.tk-multi-breakdown.location"
    tk-multi-setframerange:
      location: "@apps.tk-multi-setframerange.location"
    tk-multi-loader2: "@settings.tk-multi-loader2.nuke"
    tk-multi-publish2: "@settings.tk-multi-publish2.nuke.shot_step"
    tk-multi-shotgunpanel:
      location: "@apps.tk-multi-shotgunpanel.location"
    tk-multi-snapshot: "@settings.tk-multi-snapshot.nuke.shot_step"
    tk-multi-workfiles2: "@settings.tk-multi-workfiles2.nuke.shot_step"
    tk-nuke-template: "@settings.tk-nuke-template.shot_step"
    tk-nuke-writenode: "@settings.tk-nuke-writenode.shot"
  menu_favourites:
  - {app_instance: tk-multi-workfiles2, name: File Open...}
  - {app_instance: tk-multi-snapshot, name: Snapshot...}
  - {app_instance: tk-multi-workfiles2, name: File Save...}
  - {app_instance: tk-multi-publish2, name: Publish...}
  location: "@engines.tk-nuke.location"
